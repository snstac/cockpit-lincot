name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the tag-only release job can write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: Test + build plugin + deb/rpm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # no dependency cache: this job builds release assets on tags, and a
          # cache shared with PR runs could be poisoned (zizmor cache-poisoning)
          package-manager-cache: false

      - name: Unit tests, lint, typecheck, production bundle
        run: make ci
        env:
          NODE_ENV: production

      - name: Unit test coverage
        run: npm run test:coverage

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.41.3
          NFPM_SHA256: f92bf886c0f96767abcdc17195449faadb93fb20105532609820a412b4b2a46f
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o "${RUNNER_TEMP}/nfpm.deb"
          echo "${NFPM_SHA256}  ${RUNNER_TEMP}/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "${RUNNER_TEMP}/nfpm.deb"

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deb + rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          make deb rpm VERSION="${VERSION}"
          ls -l out/

      - name: Sanity-check package contents
        run: |
          deb=$(ls out/*.deb); echo "== $deb =="
          dpkg-deb -c "$deb" | grep -E 'cockpit/lincot|metainfo|polkit' | head
          dpkg-deb -I "$deb" | grep -E 'Package|Version|Depends|Architecture'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/*

  release:
    name: Attach packages to release
    if: github.ref_type == 'tag'
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # stable-name aliases for wget-able releases/latest/download/ URLs
          cp out/cockpit-lincot_*_all.deb out/cockpit-lincot_latest_all.deb
          cp out/cockpit-lincot-*.noarch.rpm out/cockpit-lincot-latest.noarch.rpm
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          gh release upload "${TAG}" out/*.deb out/*.rpm --clobber
